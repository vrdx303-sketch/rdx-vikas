name: RDX APK Auto-Builder

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Extract Project Zip
      run: |
        echo "Listing files..."
        ls -la
        if [ -f "RDX.zip" ]; then
          unzip RDX.zip -d extracted_project
        elif [ -d "RDX AI Studio" ]; then
          mkdir -p extracted_project
          cp -r "RDX AI Studio" extracted_project/
        else
          mkdir -p extracted_project/RDX_AI_Studio
          cp -r * extracted_project/RDX_AI_Studio/ || true
        }
        ls -la extracted_project

    - name: Install Buildozer & System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
        pip install --upgrade pip
        pip install buildozer cython

    - name: Build APK via Buildozer
      run: |
        cd extracted_project
        if [ -d "RDX AI Studio" ]; then
          cd "RDX AI Studio"
        elif [ -d "RDX_AI_Studio" ]; then
          cd "RDX_AI_Studio"
        fi
        
        if [ ! -f "buildozer.spec" ]; then
            buildozer init
        fi
        
        sed -i 's/#requirements = python3,kivy/requirements = python3,kivy,yt-dlp,requests,urllib3,certifi/g' buildozer.spec
        
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: rdx-apk-output
        path: extracted_project/**/bin/*.apk
