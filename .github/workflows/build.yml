name: RDX APK Auto-Builder

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies & Buildozer
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev ccache
        python3 -m pip install --upgrade pip
        python3 -m pip install --user --upgrade Cython==0.29.36 buildozer

    - name: Initialize Buildozer and Build APK
      run: |
        # Ensure buildozer is in path
        export PATH=$PATH:~/.local/bin
        
        if [ ! -f "buildozer.spec" ]; then
            echo y | buildozer init
        fi
        
        # Configure requirements in spec
        sed -i 's/#requirements = python3,kivy/requirements = python3,kivy,yt-dlp,requests,urllib3,certifi/gi' buildozer.spec
        
        # Run buildozer
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: rdx-apk-output
        path: bin/*.apk
