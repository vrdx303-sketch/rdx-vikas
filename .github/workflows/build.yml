name: RDX APK Auto-Builder

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python3-pip \
          build-essential \
          git \
          ffmpeg \
          libffi-dev \
          libssl-dev \
          zlib1g-dev \
          openjdk-17-jdk \
          unzip \
          zip \
          autoconf \
          libtool \
          pkg-config \
          libncurses5-dev \
          libncursesw5-dev \
          libtinfo5 \
          cmake \
          ccache

    - name: Install Buildozer & Cython
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install --user Cython==0.29.36 buildozer

    - name: Initialize and Configure Buildozer Spec
      run: |
        export PATH=$PATH:~/.local/bin
        if [ ! -f "buildozer.spec" ]; then
            buildozer init
        fi
        
        # Configure app title, package name, and python requirements for RDX AI Studio
        sed -i 's/#title = My Application/title = RDX AI Studio/g' buildozer.spec
        sed -i 's/#package.name = myapp/package.name = rdxaistudio/g' buildozer.spec
        sed -i 's/#package.domain = org.example/package.domain = com.rdx/g' buildozer.spec
        sed -i 's/#source.include_exts = py,png,jpg,kv,atlas/source.include_exts = py,png,jpg,kv,atlas,txt/g' buildozer.spec
        sed -i 's/#requirements = python3,kivy/requirements = python3,kivy,yt-dlp,requests,urllib3,certifi/g' buildozer.spec
        sed -i 's/#orientation = portrait/orientation = portrait/g' buildozer.spec

    - name: Build Real APK with Buildozer
      run: |
        export PATH=$PATH:~/.local/bin
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: rdx-apk-output
        path: bin/*.apk
