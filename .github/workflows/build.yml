name: RDX APK Auto-Builder

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Prepare Workspace
      run: |
        mkdir -p extracted_project
        if [ -f "RDX.zip" ]; then
          unzip -q RDX.zip -d extracted_project
        else
          cp -r * extracted_project/ 2>/dev/null || true
        fi
        ls -la extracted_project

    - name: Install Buildozer & System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
        pip install --upgrade pip
        pip install buildozer cython

    - name: Build APK via Buildozer
      run: |
        cd extracted_project
        # Find directory containing main.py or buildozer.spec
        TARGET_DIR=$(find . -maxdepth 3 -name "main.py" -exec dirname {} \; | head -n 1)
        if [ -z "$TARGET_DIR" ]; then
          TARGET_DIR="."
        fi
        echo "Found project at: $TARGET_DIR"
        cd "$TARGET_DIR"
        
        if [ ! -f "buildozer.spec" ]; then
            buildozer init
        fi
        
        sed -i 's/#requirements = python3,kivy/requirements = python3,kivy,yt-dlp,requests,urllib3,certifi/g' buildozer.spec
        
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: rdx-apk-output
        path: |
          extracted_project/**/bin/*.apk
          **/bin/*.apk
